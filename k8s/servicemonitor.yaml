apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  namespace: demo
  labels:
    # Com serviceMonitorSelectorNilUsesHelmValues: false (values do repo) o Prometheus
    # enxerga qualquer ServiceMonitor. A label fica para funcionar tambem com os values
    # padrao do chart, que so selecionam objetos com release: <nome do release>.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  namespaceSelector:
    matchNames: ["demo"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: demo-api
