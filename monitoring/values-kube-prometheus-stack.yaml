# Values enxutos para rodar o kube-prometheus-stack em um cluster kind.
# Instalacao:
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/values-kube-prometheus-stack.yaml

fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    # A janela do SLO e de 30 dias: com retencao menor, as series *_rate30d e o
    # painel "Disponibilidade (30d)" cobririam menos tempo do que dizem.
    retention: 31d
    scrapeInterval: 15s
    evaluationInterval: 30s
    # Sem os seletores abaixo o Operator so enxerga objetos com a label do proprio release.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1500Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "time-plataforma"
      routes:
        # Alertas de "saude do pipeline" do kube-prometheus-stack, nao sao para o plantao.
        - matchers: ['alertname=~"Watchdog|InfoInhibitor"']
          receiver: "null"
        # Alertas de SLO sao agrupados so por slo: as janelas 14,4x e 6x do mesmo
        # incidente viram uma notificacao so, em vez de duas paginas separadas.
        - matchers: ['severity="critical"', 'slo=~".+"']
          group_by: ["slo"]
          receiver: "time-plataforma-urgente"
        - matchers: ['severity="critical"']
          receiver: "time-plataforma-urgente"
        - matchers: ['severity="warning"']
          receiver: "time-plataforma"
    inhibit_rules:
      # Se o SLO ja esta paginando como critico, o warning de queima lenta do mesmo SLO
      # so duplica o ruido. Os alertas tem nomes diferentes, entao a comparacao e por slo;
      # o slo=~".+" nos dois lados evita que alertas sem slo se inibam entre si.
      - source_matchers: ['severity="critical"', 'slo=~".+"']
        target_matchers: ['severity="warning"', 'slo=~".+"']
        equal: ["slo"]
    # Os webhooks abaixo caem no webhook-logger (monitoring/webhook-logger.yaml, instalado
    # pelo make monitoring), que faz o papel do plantao: acompanhe com make plantao.
    receivers:
      - name: "null"
      - name: "time-plataforma"
        webhook_configs:
          - url: "http://webhook-logger.monitoring.svc:8080/alerta"
            send_resolved: true
      - name: "time-plataforma-urgente"
        webhook_configs:
          - url: "http://webhook-logger.monitoring.svc:8080/urgente"
            send_resolved: true
        # Em ambiente real este receiver apontaria para PagerDuty/Opsgenie:
        # pagerduty_configs:
        #   - routing_key: ${PAGERDUTY_ROUTING_KEY}

grafana:
  adminPassword: admin
  defaultDashboardsTimezone: America/Sao_Paulo
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  service:
    type: ClusterIP

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# Componentes do control plane que o kind nao expoe da forma padrao.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
