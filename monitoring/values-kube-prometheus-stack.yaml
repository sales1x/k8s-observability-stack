# Values enxutos para rodar o kube-prometheus-stack em um cluster kind.
# Instalacao:
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/values-kube-prometheus-stack.yaml

fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 15s
    evaluationInterval: 30s
    # Sem os seletores abaixo o Operator so enxerga objetos com a label do proprio release.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1500Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace", "slo"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "time-plataforma"
      routes:
        - matchers: ['severity="critical"']
          receiver: "time-plataforma-urgente"
          continue: false
        - matchers: ['severity="warning"']
          receiver: "time-plataforma"
    inhibit_rules:
      # Se o servico ja esta paginado como critico, nao mandar o warning junto.
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: ["namespace", "alertname"]
    receivers:
      - name: "time-plataforma"
        webhook_configs:
          - url: "http://webhook-logger.monitoring.svc:8080/alerta"
            send_resolved: true
      - name: "time-plataforma-urgente"
        webhook_configs:
          - url: "http://webhook-logger.monitoring.svc:8080/urgente"
            send_resolved: true
        # Em ambiente real este receiver apontaria para PagerDuty/Opsgenie:
        # pagerduty_configs:
        #   - routing_key: ${PAGERDUTY_ROUTING_KEY}

grafana:
  adminPassword: admin
  defaultDashboardsTimezone: America/Sao_Paulo
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  service:
    type: ClusterIP

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# Componentes do control plane que o kind nao expoe da forma padrao.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
